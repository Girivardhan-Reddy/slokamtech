<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>SlokamTech | Java Full Stack Development</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --bg-dark: #020817;
            --bg-navy: #050e1f;
            --blue-electric: #2f7df6;
            --blue-glow: #1e4bb0;
            --gold: #f5c542;
            --gold-soft: #e6b800;
            --text-light: #f0f6ff;
            --text-muted: #b8c7e0;
            --glass-bg: rgba(10, 20, 40, 0.6);
            --border-glow: 1px solid rgba(47, 125, 246, 0.4);
            --radius-card: 24px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            background: var(--bg-dark);
            color: var(--text-light);
            overflow-x: hidden;
            line-height: 1.5;
            scroll-behavior: smooth;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        /* Navbar */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(2, 8, 23, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(47, 125, 246, 0.15);
            transition: all 0.3s;
            padding: 0.6rem 0;
        }

        .navbar.scrolled {
            background: rgba(2, 8, 23, 0.92);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
        }

        .nav-wrap {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        .logo-brand {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-weight: 700;
            font-size: 1.6rem;
            letter-spacing: -0.5px;
            color: white;
            text-decoration: none;
            cursor: pointer;
        }

        .logo-img {
            width: 44px;
            height: 44px;
            object-fit: contain;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(47, 125, 246, 0.3);
            background: transparent;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
            align-items: center;
        }

        .nav-links a {
            color: #d0ddf0;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: 0.2s;
            cursor: pointer;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--gold);
            text-shadow: 0 0 10px rgba(245, 197, 66, 0.3);
        }

        .nav-course-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            padding: 0.7rem 1.2rem;
            border-radius: 999px;
            border: 1px solid rgba(245, 197, 66, 0.5);
            background: rgba(245, 197, 66, 0.08);
            color: var(--gold);
            font-size: 0.8rem;
            font-weight: 800;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            white-space: nowrap;
            box-shadow: 0 0 18px rgba(245, 197, 66, 0.12);
        }

        .nav-course-link:hover {
            background: rgba(245, 197, 66, 0.12);
            box-shadow: 0 0 26px rgba(245, 197, 66, 0.2);
        }

        .course-marquee {
            position: relative;
            overflow: hidden;
            width: min(100%, 620px);
            border: 1px solid rgba(47, 125, 246, 0.28);
            background: rgba(6, 16, 31, 0.7);
            border-radius: 999px;
            margin-top: 1rem;
            box-shadow: inset 0 0 20px rgba(47, 125, 246, 0.06);
        }

        .course-marquee-track {
            display: flex;
            align-items: center;
            gap: 2.2rem;
            white-space: nowrap;
            padding: 0.7rem 1rem;
            min-width: max-content;
            animation: marqueeScroll 18s linear infinite;
            color: #dfe8fb;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .course-marquee-track span {
            color: #dfe8fb;
        }

        .course-marquee-track span::before {
            content: '•';
            margin-right: 0.9rem;
            color: var(--gold);
        }

        @keyframes marqueeScroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .btn-join {
            background: linear-gradient(135deg, #f5c542, #d4a017);
            border: none;
            padding: 0.65rem 1.8rem;
            border-radius: 50px;
            font-weight: 700;
            color: #020817;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(245, 197, 66, 0.4);
            transition: 0.2s;
            letter-spacing: 0.5px;
            font-size: 0.9rem;
        }

        .btn-join:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 35px #f5c542;
        }

        .hamburger {
            display: none;
            font-size: 2rem;
            color: white;
            background: none;
            border: none;
            cursor: pointer;
        }

        .mobile-menu {
            display: none;
            flex-direction: column;
            background: rgba(2, 8, 23, 0.98);
            backdrop-filter: blur(20px);
            padding: 2rem;
            border-bottom: 1px solid var(--blue-glow);
        }

        .mobile-menu a {
            color: white;
            padding: 1rem 0;
            text-decoration: none;
            font-weight: 500;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
        }

        /* Hero Section with Video Background */
        .hero {
            position: relative;
            min-height: calc(100vh - 72px);
            display: flex;
            align-items: center;
            overflow: hidden;
            padding: 4rem 0 3.5rem;
            isolation: isolate;
            background: #020817;
        }

        /* The hero never displays the SlokamTech logo as a foreground element. */
        /* Keep the animation primarily on the RIGHT so the left content stays clean. */
        .hero-video {
            position: absolute;
            top: 0;
            left: 36%;
            width: 64%;
            height: 100%;
            object-fit: cover;
            object-position: 50% center;
            z-index: 0;
            display: block;
            pointer-events: none;
            background: #020817;
        }

        /* Dark left panel + soft blend into the video. */
        .hero-overlay {
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background:
                linear-gradient(90deg,
                    rgba(2, 8, 23, 1) 0%,
                    rgba(2, 8, 23, 0.98) 27%,
                    rgba(2, 8, 23, 0.88) 39%,
                    rgba(2, 8, 23, 0.35) 51%,
                    rgba(2, 8, 23, 0.08) 67%,
                    rgba(2, 8, 23, 0.18) 100%);
        }

        .hero-grid {
            position: relative;
            z-index: 3;
            width: 100%;
            display: grid;
            grid-template-columns: minmax(0, 44%) minmax(0, 56%);
            align-items: center;
            gap: 0;
            min-height: calc(100vh - 160px);
        }

        .hero-left {
            position: relative;
            z-index: 5;
            width: 100%;
            max-width: 640px;
            padding-right: 1.5rem;
        }

        .badge {
            background: rgba(15, 55, 120, 0.45);
            border: 1px solid rgba(47, 125, 246, 0.55);
            padding: 0.38rem 1.2rem;
            border-radius: 30px;
            font-weight: 700;
            letter-spacing: 1px;
            font-size: 0.72rem;
            text-transform: uppercase;
            color: #c9ddff;
            display: inline-block;
            margin-bottom: 1rem;
            box-shadow: 0 0 22px rgba(47, 125, 246, 0.12);
        }

        .hero-heading {
            font-size: clamp(2.8rem, 4.1vw, 4.15rem);
            font-weight: 850;
            line-height: 1.08;
            letter-spacing: -1.5px;
            margin-bottom: 0.85rem;
            text-wrap: balance;
        }

        .gold-gradient {
            background: linear-gradient(135deg, #f5c542, #ffdf80);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .learn-build {
            font-size: clamp(1.25rem, 1.8vw, 1.65rem);
            font-weight: 800;
            margin-bottom: 1rem;
        }

        .text-gold { color: var(--gold); }
        .text-blue { color: var(--blue-electric); }

        .hero-desc {
            color: #c4d1e5;
            max-width: 570px;
            margin-bottom: 1.55rem;
            font-size: 1rem;
            line-height: 1.65;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.55);
        }

        .hero-btns {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .btn-primary {
            background: linear-gradient(135deg, #f5c542, #d4a017);
            border: none;
            padding: 0.85rem 2.2rem;
            border-radius: 50px;
            font-weight: 750;
            color: #020817;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(245, 197, 66, 0.38);
            transition: transform 0.2s, box-shadow 0.2s;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 40px rgba(245, 197, 66, 0.65);
        }

        .btn-secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(2, 8, 23, 0.2);
            border: 2px solid var(--gold);
            color: var(--gold);
            padding: 0.85rem 2.2rem;
            border-radius: 50px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
            font-size: 0.95rem;
            backdrop-filter: blur(4px);
        }

        .btn-secondary:hover {
            background: rgba(245, 197, 66, 0.1);
            box-shadow: 0 0 20px rgba(245, 197, 66, 0.22);
        }

        .tech-badges {
            display: flex;
            flex-wrap: nowrap;
            gap: 0.55rem;
            margin-top: 1.65rem;
            max-width: 100%;
        }

        .tech-badge {
            background: rgba(5, 16, 36, 0.78);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(47, 125, 246, 0.3);
            padding: 0.42rem 0.72rem;
            border-radius: 40px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.73rem;
            color: #d9e5f7;
            white-space: nowrap;
        }

        .tech-badge i { font-size: 0.82rem; }
/* Keep the right-side animation visually crisp and secondary elements subtle. */
        .hero::after {
            content: '';
            position: absolute;
            inset: auto 0 0 36%;
            height: 22%;
            z-index: 1;
            pointer-events: none;
            background: linear-gradient(180deg, transparent, rgba(2, 8, 23, 0.55));
        }

        @media (min-width: 1200px) {
            .hero-grid {
                grid-template-columns: minmax(0, 45%) minmax(0, 55%);
            }
            .hero-video {
                left: 34%;
                width: 66%;
            }
            .hero::after { left: 34%; }
            .hero-overlay {
                background:
                    linear-gradient(90deg,
                        rgba(2, 8, 23, 1) 0%,
                        rgba(2, 8, 23, 0.99) 28%,
                        rgba(2, 8, 23, 0.9) 39%,
                        rgba(2, 8, 23, 0.42) 51%,
                        rgba(2, 8, 23, 0.08) 68%,
                        rgba(2, 8, 23, 0.16) 100%);
            }
        }

        /* Curriculum sections */
/* Curriculum sections */
        .curriculum-section {
            padding: 5rem 0;
        }

        .section-title {
            font-size: 2.5rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .category-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            justify-content: center;
            margin-top: 2rem;
        }

        .category-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(47, 125, 246, 0.3);
            border-radius: 28px;
            padding: 2rem 1.8rem;
            flex: 1 1 280px;
            transition: 0.3s;
        }

        .category-card:hover {
            border-color: var(--gold);
            box-shadow: 0 0 35px rgba(245, 197, 66, 0.2);
            transform: translateY(-6px);
        }

        .workshop-card {
            border-color: rgba(139, 92, 246, 0.5);
            background: linear-gradient(180deg, rgba(12, 18, 31, 0.92), rgba(12, 18, 31, 0.74));
        }

        .course-highlight {
            font-size: 1.5rem;
            font-weight: 800;
            margin: 0.5rem 0 0.75rem;
            color: #f3f7ff;
            letter-spacing: -0.03em;
        }

        .workshop-desc {
            color: var(--text-muted);
            margin-bottom: 1.2rem;
            font-size: 0.98rem;
            line-height: 1.6;
        }

        .workshop-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 1.1rem;
            color: var(--gold);
            text-decoration: none;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .workshop-link:hover {
            text-shadow: 0 0 15px rgba(245, 197, 66, 0.4);
        }

        .category-title {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tech-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
        }

        .tech-item {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(47, 125, 246, 0.3);
            padding: 0.6rem 1.2rem;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }

        .tech-item:hover {
            border-color: var(--blue-electric);
            box-shadow: 0 0 15px #2f7df6;
            transform: scale(1.05);
        }

        /* Benefits strip */
        .benefit-strip {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 2rem;
            background: rgba(10, 20, 40, 0.6);
            border-radius: 60px;
            padding: 1.8rem 2rem;
            margin: 3rem auto;
            max-width: 1100px;
        }

        .benefit-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
        }

        /* Cards */
        .double-card {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 2rem;
            margin: 4rem auto;
            max-width: 1100px;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(47, 125, 246, 0.35);
            border-radius: 32px;
            padding: 2.5rem;
            flex: 1 1 400px;
            text-align: center;
        }

        .points-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-top: 2rem;
            text-align: left;
        }

        .point-item {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .point-num {
            width: 40px;
            height: 40px;
            border: 2px solid var(--blue-electric);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #b8d4ff;
            box-shadow: 0 0 12px rgba(47, 125, 246, 0.5);
        }

        .check-list {
            text-align: left;
            margin-top: 1.5rem;
        }

        .check-list i {
            color: var(--gold);
            margin-right: 10px;
        }

        /* Loader */
        .loader-section {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 4rem;
            padding: 5rem 0;
            text-align: center;
        }

        .loader-circle {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 6px solid #1e4bb0;
            border-top: 6px solid #f5c542;
            animation: spin 4s linear infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 50px #2f7df6;
            position: relative;
            overflow: hidden;
        }

        .loader-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            animation: spinReverse 4s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
        @keyframes spinReverse {
            100% { transform: rotate(-360deg); }
        }

        .progress-bar-bg {
            width: 100%;
            height: 18px;
            background: #1a2a44;
            border-radius: 20px;
            margin: 1.5rem auto;
            max-width: 500px;
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #f5c542, #2f7df6);
            border-radius: 20px;
            transition: width 0.1s linear;
        }

        .progress-percent {
            font-size: 2rem;
            font-weight: 700;
            color: var(--gold);
            letter-spacing: 2px;
        }

        /* Footer */
        footer {
            background: #020817;
            padding: 3rem 0;
            border-top: 1px solid rgba(47, 125, 246, 0.3);
        }

        /* Curriculum Page Specific Styles */
        .curriculum-page {
            min-height: 100vh;
            padding: 2rem 0 4rem;
        }

        .back-to-home {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--gold);
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 2rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .back-to-home:hover {
            text-shadow: 0 0 15px rgba(245, 197, 66, 0.7);
        }

        .curriculum-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .curriculum-header h1 {
            font-size: 3rem;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 1rem;
        }

        .curriculum-subtitle {
            font-size: 1.2rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .curriculum-meta {
            font-size: 1.1rem;
            color: var(--gold);
            font-weight: 600;
        }

        .horizontal-steps {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.75rem 1.5rem;
            margin: 2rem 0 0.25rem;
            padding: 0.5rem 0.5rem 0;
            border-bottom: 2px solid rgba(47, 125, 246, 0.25);
            position: relative;
        }

        .step-tab {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.2rem;
            padding: 0.6rem 1.2rem;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 1.3rem;
            cursor: pointer;
            transition: 0.2s;
            border-radius: 8px 8px 0 0;
            position: relative;
            min-width: 70px;
            font-family: inherit;
            letter-spacing: 0.3px;
            line-height: 1.2;
        }

        .step-tab .step-num {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
            transition: 0.2s;
            opacity: 0.7;
            letter-spacing: 0.5px;
        }

        .step-tab .step-label {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-muted);
            transition: 0.2s;
            white-space: nowrap;
        }

        .step-tab:hover {
            color: var(--gold);
            background: rgba(245, 197, 66, 0.06);
        }

        .step-tab:hover .step-num {
            color: var(--gold);
            opacity: 1;
        }
        .step-tab:hover .step-label {
            color: var(--gold);
        }

        .step-tab.active {
            color: var(--gold);
            border-bottom: 3px solid var(--gold);
            background: rgba(245, 197, 66, 0.08);
        }

        .step-tab.active .step-num {
            color: var(--gold);
            opacity: 1;
        }
        .step-tab.active .step-label {
            color: var(--gold);
        }

        .curriculum-layout {
            margin-top: 1.5rem;
        }

        .course-content {
            background: rgba(10, 20, 40, 0.6);
            border: 1px solid rgba(47, 125, 246, 0.3);
            border-radius: 24px;
            padding: 2.5rem;
            min-height: 400px;
        }

        .course-content h2 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--gold);
        }

        .course-content p {
            color: var(--text-muted);
            margin-bottom: 1.5rem;
        }

        .course-modules {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .module-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(47, 125, 246, 0.2);
            border-radius: 12px;
            padding: 1rem;
            transition: 0.3s;
        }

        .module-item:hover {
            border-color: var(--blue-electric);
            box-shadow: 0 0 15px rgba(47, 125, 246, 0.2);
        }

        .module-item h4 {
            color: var(--text-light);
            margin-bottom: 0.3rem;
            font-size: 1rem;
        }

        .module-item p {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 0;
        }

        .program-format,
        .curriculum-extra {
            margin-top: 2rem;
            padding: 2rem;
            background: var(--glass-bg);
            border: var(--border-glow);
            border-radius: var(--radius-card);
        }

        .program-format-grid,
        .package-grid,
        .approach-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1rem;
            margin-top: 1.25rem;
        }

        .format-item,
        .info-card {
            padding: 1rem;
            background: rgba(255, 255, 255, 0.035);
            border: 1px solid rgba(47, 125, 246, 0.25);
            border-radius: 14px;
        }

        .format-item strong,
        .info-card h3 {
            color: var(--gold);
        }

        .course-facts {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin: 1rem 0 1.5rem;
        }

<body>
    <div id="app"></div>

    <script>
        // ============ ROUTING SYSTEM ============
        /*
         * GitHub Pages project-site configuration
         *
         * Current test deployment:
         *   https://girivardhan-reddy.github.io/slokamtech/
         *
         * Curriculum:
         *   https://girivardhan-reddy.github.io/slokamtech/ciriculam
         *
         * Later, when the custom domain is connected:
         *   https://slokamtech.com/
         *   https://slokamtech.com/ciriculam
         *
         * The base path is detected automatically so the same index.html
         * works in both environments.
         */
        const BASE_PATH = (() => {
            const host = window.location.hostname.toLowerCase();

            // GitHub Pages project site:
            // https://girivardhan-reddy.github.io/slokamtech/
            if (host.endsWith('github.io')) {
                return '/slokamtech/';
            }

            // Custom domain:
            // https://slokamtech.com/
            return '/';
        })();

        function normalizeRoute(path) {
            if (!path) return '/';

            let value = String(path);

            // Remove query/hash when a full URL-like value is supplied.
            value = value.split('?')[0].split('#')[0];

            // Decode safely.
            try {
                value = decodeURIComponent(value);
            } catch (_) {}

            // Convert the GitHub project URL into an app route.
            if (BASE_PATH !== '/' && value.startsWith(BASE_PATH)) {
                value = value.substring(BASE_PATH.length - 1);
            }

            if (!value.startsWith('/')) {
                value = '/' + value;
            }

            value = value.replace(/\/{2,}/g, '/');

            if (value.length > 1) {
                value = value.replace(/\/+$/, '');
            }

            // Requested public route.
            if (value === '/curriculum') {
                value = '/ciriculam';
            }

            return value || '/';
        }

        function assetUrl(file) {
            const cleanFile = String(file).replace(/^\/+/, '');
            return BASE_PATH + cleanFile;
        }

        function routeUrl(path) {
            const route = normalizeRoute(path);

            if (route === '/') {
                return BASE_PATH;
            }

            return BASE_PATH + route.replace(/^\/+/, '');
        }

        class Router {
            constructor() {
                this.routes = {};
                this.init();
            }

            addRoute(path, handler) {
                this.routes[normalizeRoute(path)] = handler;
            }

            navigate(path) {
                const route = normalizeRoute(path);

                if (window.location.protocol === 'file:') {
                    const targetUrl = route === '/'
                        ? window.location.pathname
                        : `${window.location.pathname}?route=${encodeURIComponent(route)}`;

                    window.history.pushState({}, '', targetUrl);
                } else {
                    window.history.pushState({}, '', routeUrl(route));
                }

                this.handleRoute();
            }

            handleRoute() {
                let requestedPath = '/';

                if (window.location.protocol === 'file:') {
                    requestedPath =
                        new URLSearchParams(window.location.search).get('route') || '/';
                } else {
                    // 404.html can send the original route through ?route=...
                    const fallbackRoute =
                        new URLSearchParams(window.location.search).get('route');

                    requestedPath = fallbackRoute || window.location.pathname;

                    // Remove the fallback query once the route is restored.
                    if (fallbackRoute) {
                        const cleanUrl = routeUrl(fallbackRoute);
                        window.history.replaceState({}, '', cleanUrl);
                        requestedPath = fallbackRoute;
                    }
                }

                const path = normalizeRoute(requestedPath);
                const handler =
                    this.routes[path] ||
                    this.routes['/'];

                if (landingProgressAnimationFrame) {
                    cancelAnimationFrame(landingProgressAnimationFrame);
                    landingProgressAnimationFrame = null;
                }

                const mobileMenu =
                    document.getElementById('mobileMenu');

                if (mobileMenu) {
                    mobileMenu.classList.remove('show');
                }

                handler();
                window.scrollTo(0, 0);
            }

            init() {
                window.addEventListener('popstate', () => {
                    this.handleRoute();
                });
            }
        }

        let landingProgressAnimationFrame = null;
        const router = new Router();

        function routeHref(path) {
            if (window.location.protocol === 'file:') {
                return path === '/'
                    ? window.location.pathname
                    : `?route=${encodeURIComponent(normalizeRoute(path))}`;
            }

            return routeUrl(path);
        }

        // ============ NAVBAR COMPONENT ============
        function renderNavbar(activePage = '') {
            const navbarHTML = `
                <nav class="navbar" id="navbar">
                    <div class="nav-wrap">
                        <a href="${routeHref('/')}" class="logo-brand" onclick="handleNavigation(event, '/')">
                            <img src="${assetUrl('logo.jpeg')}" alt="SlokamTech Logo" class="logo-img">
                            SlokamTech
                        </a>

        // ============ LANDING PAGE SCRIPTS ============
        function initLandingPageScripts() {
            window.onscroll = () => {
                const nav = document.getElementById('navbar');
                if (window.scrollY > 50) nav.classList.add('scrolled');
                else nav.classList.remove('scrolled');
            };
            
            // Keep the hero video autoplaying continuously when the browser permits it.
            const heroVideo = document.querySelector('.hero-video');
            if (heroVideo) {
                heroVideo.muted = true;
                heroVideo.setAttribute('muted', '');
                heroVideo.setAttribute('playsinline', '');
                const startHeroVideo = () => {
                    const playPromise = heroVideo.play();
                    if (playPromise && typeof playPromise.catch === 'function') {
                        playPromise.catch(() => {});
                    }
                };
                startHeroVideo();
                heroVideo.addEventListener('canplay', startHeroVideo, { once: true });
                heroVideo.addEventListener('pause', startHeroVideo);
            }

            const progressFill = document.getElementById('progressFill');
            const progressPercent = document.getElementById('progressPercent');
            if (progressFill && progressPercent) {
                let cycleStartTime;
                const animationDuration = 4000;
                const resetDelay = 500;
                const cycleDuration = animationDuration + resetDelay;
                
                function animateProgress(timestamp) {
                    if (cycleStartTime === undefined) cycleStartTime = timestamp;

                    const elapsed = (timestamp - cycleStartTime) % cycleDuration;
                    const currentProgress = elapsed < animationDuration
                        ? Math.min(100, (elapsed / animationDuration) * 100)
                        : 100;

                    progressFill.style.width = currentProgress + '%';
                    progressPercent.textContent = Math.floor(currentProgress) + '%';
                    landingProgressAnimationFrame = requestAnimationFrame(animateProgress);
                }
                
                const loaderSection = document.querySelector('.loader-section');
                if (loaderSection) {
                    const observer = new IntersectionObserver((entries) => {
                        entries.forEach(entry => {
                            if (entry.isIntersecting) {
                                landingProgressAnimationFrame = requestAnimationFrame(animateProgress);
                                observer.unobserve(entry.target);
                            }
                        });
                    }, { threshold: 0.3 });
                    observer.observe(loaderSection);
                }
            }
            
            const revealElements = document.querySelectorAll('.glass-card, .category-card, .benefit-item');
            const revealObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) entry.target.style.opacity = 1;
                });
            }, { threshold: 0.2 });
            
            revealElements.forEach(el => {
                el.style.opacity = 0;
                el.style.transition = 'opacity 0.7s';
                revealObserver.observe(el);
            });
        }

        // Initial route resolution.
        // 404.html may redirect a deep link to:
        // /slokamtech/?route=/ciriculam
        // The Router consumes that route and restores the clean URL.
        router.handleRoute();
    </script>
