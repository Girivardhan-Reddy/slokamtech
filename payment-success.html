<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Status | SlokamTech</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    :root {
      --bg: #050b16;
      --panel: rgba(12, 20, 34, 0.9);
      --card: rgba(17, 28, 45, 0.92);
      --text: #edf3ff;
      --text-soft: #bfd0eb;
      --line: rgba(122, 148, 198, 0.18);
      --gold: #f5c542;
      --success: #34d399;
      --danger: #f87171;
      --pending: #60a5fa;
      --shadow: 0 30px 70px rgba(5, 11, 22, 0.7);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: Inter, Segoe UI, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(139, 92, 246, 0.18), transparent 28%),
        radial-gradient(circle at top right, rgba(96, 165, 250, 0.14), transparent 26%),
        var(--bg);
    }
    .nav {
      border-bottom: 1px solid rgba(96, 165, 250, 0.14);
      background: rgba(5, 11, 22, 0.76);
      backdrop-filter: blur(18px);
    }
    .nav-inner {
      max-width: 1120px;
      margin: 0 auto;
      padding: 1rem 1.2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.8rem;
      font-weight: 900;
      color: var(--text);
      text-decoration: none;
    }
    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.85), rgba(96, 165, 250, 0.7));
      color: white;
      font-size: 0.72rem;
    }
    main {
      max-width: 980px;
      margin: 0 auto;
      padding: 4rem 1.2rem;
    }
    .panel {
      background: linear-gradient(180deg, rgba(16, 23, 36, 0.96), rgba(12, 18, 28, 0.92));
      border: 1px solid rgba(96, 165, 250, 0.16);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: clamp(1.4rem, 4vw, 2.4rem);
    }
    .status-head {
      display: grid;
      gap: 0.6rem;
      text-align: center;
      margin-bottom: 2rem;
    }
    .status-icon {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      margin: 0 auto 0.8rem;
      background: rgba(52, 211, 153, 0.12);
      border: 1px solid rgba(52, 211, 153, 0.4);
      color: var(--success);
      font-size: 2rem;
    }
    .status-icon.pending { color: var(--pending); border-color: rgba(96, 165, 250, 0.45); background: rgba(96, 165, 250, 0.12); }
    .status-icon.failed { color: var(--danger); border-color: rgba(248, 113, 113, 0.42); background: rgba(248, 113, 113, 0.12); }
    h1 { font-size: clamp(2rem, 5vw, 3rem); line-height: 1.08; letter-spacing: -0.03em; }
    p { color: var(--text-soft); }
    .details {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.8rem;
      margin-top: 1.5rem;
    }
    .item {
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 0.9rem 1rem;
      min-height: 74px;
    }
    .item span {
      display: block;
      color: #8fa9cb;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.3rem;
    }
    .item strong {
      color: var(--text);
      overflow-wrap: anywhere;
    }
    .actions {
      display: flex;
      gap: 0.8rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 2rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      min-height: 48px;
      padding: 0.8rem 1.25rem;
      border-radius: 999px;
      border: 0;
      cursor: pointer;
      text-decoration: none;
      font-weight: 800;
      font: inherit;
    }
    .btn-primary { background: linear-gradient(135deg, var(--gold), #d4a017); color: #0a1220; }
    .btn-secondary { border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.03); color: var(--text); }
    .message {
      color: var(--text-soft);
      text-align: center;
      padding: 1rem;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.02);
    }
    @media (max-width: 720px) {
      .details { grid-template-columns: 1fr; }
      .nav-inner { align-items: flex-start; flex-direction: column; }
      .actions { flex-direction: column; }
      .btn { width: 100%; }
    }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a class="brand" href="claude.html"><span class="brand-mark">&lt;/&gt;</span><span>SlokamTech</span></a>
      <a class="btn btn-secondary" href="claude.html#register"><i class="fas fa-arrow-left"></i> Back to Workshop</a>
    </div>
  </nav>

  <main>
    <section class="panel">
      <div id="statusHead" class="status-head">
        <div id="statusIcon" class="status-icon pending"><i class="fas fa-spinner fa-spin"></i></div>
        <h1 id="statusTitle">Verifying Payment</h1>
        <p id="statusMessage">Please wait while we confirm your payment securely with Cashfree.</p>
      </div>

      <div id="details" class="details" style="display:none;"></div>

      <div id="actions" class="actions" style="display:none;">
        <a id="receiptBtn" class="btn btn-primary" href="#" target="_blank" rel="noopener"><i class="fas fa-download"></i> Download Receipt</a>
        <button id="checkBtn" class="btn btn-secondary" type="button"><i class="fas fa-rotate"></i> Check Payment Status</button>
        <a class="btn btn-secondary" href="claude.html#register"><i class="fas fa-arrow-left"></i> Back to Workshop</a>
      </div>
    </section>
  </main>

  <script>
    const API_BASE_URL = window.location.hostname === 'localhost'
      ? 'http://localhost:5000'
      : 'http://127.0.0.1:5000';

    const params = new URLSearchParams(window.location.search);
    const orderId = params.get('order_id');
    const statusIcon = document.getElementById('statusIcon');
    const statusTitle = document.getElementById('statusTitle');
    const statusMessage = document.getElementById('statusMessage');
    const details = document.getElementById('details');
    const actions = document.getElementById('actions');
    const receiptBtn = document.getElementById('receiptBtn');
    const checkBtn = document.getElementById('checkBtn');

    function value(row, keys) {
      for (const key of keys) {
        if (row && row[key] !== undefined && row[key] !== null && row[key] !== '') return row[key];
      }
      return '-';
    }

    function setIcon(type) {
      statusIcon.className = `status-icon ${type}`;
      if (type === 'failed') statusIcon.innerHTML = '<i class="fas fa-times"></i>';
      else if (type === 'pending') statusIcon.innerHTML = '<i class="fas fa-clock"></i>';
      else statusIcon.innerHTML = '<i class="fas fa-check"></i>';
    }

    function renderDetails(data) {
      const registration = data.registration || {};
      const rows = [
        ['Course', value(registration, ['course_name', 'course'])],
        ['Name', value(registration, ['full_name', 'name'])],
        ['Email', value(registration, ['email'])],
        ['Phone', value(registration, ['phone'])],
        ['Amount Paid', `₹${value(registration, ['amount'])}`],
        ['Payment ID', data.payment_id || value(registration, ['payment_id'])],
        ['Order ID', data.cashfree_order_id || data.order_id || value(registration, ['cashfree_order_id', 'order_id'])],
        ['Payment Status', data.payment_status || value(registration, ['payment_status'])],
        ['Registration Status', data.registration_status || value(registration, ['registration_status'])]
      ];
      details.innerHTML = rows.map(([label, item]) => `<div class="item"><span>${label}</span><strong>${item}</strong></div>`).join('');
      details.style.display = 'grid';
    }

    async function verifyPayment() {
      if (!orderId) {
        setIcon('failed');
        statusTitle.textContent = 'Missing Order ID';
        statusMessage.textContent = 'We could not find an order ID in the payment return URL.';
        actions.style.display = 'flex';
        receiptBtn.style.display = 'none';
        checkBtn.style.display = 'none';
        return;
      }

      statusIcon.className = 'status-icon pending';
      statusIcon.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
      statusTitle.textContent = 'Verifying Payment';
      statusMessage.textContent = 'Please wait while we confirm your payment securely with Cashfree.';

      try {
        const response = await fetch(`${API_BASE_URL}/api/verify-payment?order_id=${encodeURIComponent(orderId)}`);
        const data = await response.json();
        renderDetails(data);
        actions.style.display = 'flex';
        receiptBtn.href = `${API_BASE_URL}/api/receipt/${encodeURIComponent(orderId)}`;

        if (data.payment_status === 'PAID') {
          setIcon('');
          statusTitle.textContent = 'Payment Successful';
          statusMessage.textContent = 'Registration Confirmed. Thank you for registering!';
          receiptBtn.style.display = 'inline-flex';
          checkBtn.style.display = 'none';
        } else if (data.payment_status === 'FAILED' || data.payment_status === 'USER_DROPPED') {
          window.location.href = `payment-failed.html?order_id=${encodeURIComponent(orderId)}`;
        } else {
          setIcon('pending');
          statusTitle.textContent = 'Payment Pending';
          statusMessage.textContent = 'We are waiting for payment confirmation from Cashfree.';
          receiptBtn.style.display = 'none';
          checkBtn.style.display = 'inline-flex';
        }
      } catch (error) {
        setIcon('pending');
        statusTitle.textContent = 'Payment Status Unavailable';
        statusMessage.textContent = 'We could not verify the payment right now. Please check again.';
        actions.style.display = 'flex';
        receiptBtn.style.display = 'none';
        checkBtn.style.display = 'inline-flex';
      }
    }

    checkBtn.addEventListener('click', verifyPayment);
    verifyPayment();
  </script>
</body>
</html>
